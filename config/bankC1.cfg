# bankC1.cfg — Star Ocean (Japan)
#
# Bank $C1 is the second 1MB page of the S-DD1 MMC window. Contains
# additional game logic, battle engine, and map/event code. The S-DD1
# decompression is used to stream compressed graphics and map data
# from ROM into VRAM via DMA channels that are gated by $4800/$4801.

bank = 0xC1

# This bank contains overflow game logic from the first MMC page.
# Functions here are called via JSL from the bank $C0 main loop.
# The auto-discovery pass should find most reachable functions via
# static analysis of JSL/JSR targets from bank $C0.
