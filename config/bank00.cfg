# bank00.cfg — Star Ocean (Japan)
#
# Bank 00 contains the 65816 interrupt vector table, the boot code,
# and low-bank ROM routines. Star Ocean is an S-DD1 LoROM game.
#
# Verified via dis65816.py disassembly and JSR/RTS analysis of the ROM.
# Functions are bounded by JSR targets and their matching RTS/RTL.

bank = 0
auto_vectors

# --- Boot code (verified via disassembly) ---
# RESET vector ($FFFC emulation) -> $00:FEC1
# Boot code runs from $FEC1 through $FF96, where it JMLs to $C0:8001
func ResetHandler FEC1 end:FF96

# --- NMI/IRQ trampolines (verified) ---
# NMI trampoline at $FEB9: JML $C0:0000
func NmiTrampoline FEB9 end:FEBD
# IRQ trampoline at $FEBD: JML $C0:0221
func IrqTrampoline FEBD end:FEC1

# --- Boot entry into MMC window ---
# At $FF96, boot code JMLs to $C0:8001
func BootMmcEntry FF96 end:FF97

# --- Vector table region (data) ---
exclude_range FFE0 FFFF

# --- LLE-only: hardware wait loops (boot NMI / auto-joypad) ---
# The F6DD-F6FE region polls $4210 (NMI) and $4212 (auto-joypad) in tight
# loops. As AOT blocks they never yield (no master deadline is armed in
# quiescent mode), so the frame driver cannot deliver the vblank NMI and
# boot freezes at F6FE. The interpreter's quiescent-spin detection handles
# these waits correctly (same as 1.Release). Keep them LLE.
force_lle 0x00F000
force_lle 0x00F013
force_lle 0x00F6D6
force_lle 0x00F6DD
force_lle 0x00F6E1
force_lle 0x00F6F5
force_lle 0x00F6F7
force_lle 0x00F6FE
force_lle 0x00F709

# --- Verified functions (from JSR target + RTS/RTL boundary analysis) ---
# These are real functions found by matching JSR call targets with
# their nearest RTS/RTL return instructions.

# SPC upload and initialization (called during boot)
func SpcUploadInit 8079 end:80E8
func SpcUploadSetup 80E8 end:80F7
func SpcUploadData 80F7 end:8319

# PPU/DMA setup routines
func SetupPpuAndDma 8319 end:832C
func PpuConfigA 8364 end:83B3
func PpuConfigB 8419 end:841F

# VBlank/wait routines
func WaitForVBlank 8500 end:854E
func ShortWait 8568 end:856A

# Main initialization sequence (large function)
func MainInit 8A00 end:8BCB

# Level loading and decompression
func LoadCompressedData 8CAD end:8D35
func DecompressAndUpload 8D7B end:8E9F

# SPC700 communication
func SendSpcCommand 8F7B end:9043
func ReadSpcResponse 9043 end:9053

# PPU register setup
func ConfigurePpuRegisters 95AD end:9628

# Palette management
func LoadPalettes 985A end:98CF
func FadePalette 98A5 end:98CF

# HDMA setup
func SetupHdma 9900 end:99CC

# Tilemap upload
func UploadTilemaps 99E6 end:9A0F

# Graphics decompression
func DecompressGraphics 9AAD end:9C73

# Stripe image loading
func LoadStripeImages 9CA5 end:9CA7

# OAM update
func UpdateOam 9D00 end:9D6A

# Input handling
func PollControllers 9D7B end:9D8B

# Status bar
func UpdateStatusBar 9EA0 end:9F2C

# Game mode helpers
func ModeHelper1 9FAD end:9FB7

# Level data loading
func LoadLevelData A1A5 end:A26B
func ProcessLevelData A28B end:A2F5

# Object/sprite processing
func ProcessObjects A500 end:A539
func UpdateSprites A58B end:A728

# Collision detection
func CheckCollisions A98B end:A9D7

# Sound driver interface
func SendSoundCommand AA00 end:AA44

# Miscellaneous utilities
func Utility1 AB48 end:AB8C
func Utility2 B022 end:B03E

# Map/overworld
func LoadMapData B164 end:B211
func UpdateMap B2A0 end:B363

# String/text handling
func LoadString B99B end:B9A8

# DMA transfer helpers
func SetupDmaTransfer BC5A end:BD02

# Decompression engine
func DecompressEngine BDE8 end:BE3A

# Finalization
func FinalizeLoad BEA5 end:BF72

# --- Mid-function entry points ---
name 843B NmiSubEntry1
name 8449 NmiSubEntry2
name B983 DecompressFetchByte
