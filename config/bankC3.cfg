# bankC3.cfg — Star Ocean (Japan) — banco C3 (página 0 del S-DD1 MMC)
#
# El perfil del título (trace bsnes f17-627 + hotzones) mostró que el trabajo
# LLE del menú se concentra en UNA rutina: el animador de estrellas del fondo
# del título. AVISO IMPORTANTE: el trace de bsnes se grabó con la ROM traducida
# al castellano (E:\...Traducida Castellano.sfc), que inserta una comprobación
# de banco $7E/$7F en el prólogo y DESPLAZA la rutina +3 bytes ($C3:8F61+ en el
# trace = $C3:8F5E en la ROM original). Este cfg usa la ROM ORIGINAL del
# proyecto (la que ejecuta el recomp).
#
# Estructura verificada (ROM original, disasm_starfield.py):
#   $C3:8F50  prólogo: LDA #$0001 (M16) / STA $32 / SEP #$20 / LDA $0007,Y /
#            BMI +2 / STZ $32  — inicializa el contador de estrellas $32
#   $C3:8F5E  bucle principal: LDA $0000,Y / STA $28 / LDX $10 / REP #$20 /
#            INY / ... — cálculo de posición de cada estrella con RNG ($14),
#            multiplicador HW ($4202/3 vía JSR $ADAC/$AD6E) y escrituras al
#            buffer $00,X
#   $C3:9083/908C  JMP $8F5E  — loop-back del bucle (por estrella)
#   $C3:9093  JMP $8D93  — vuelve al loop padre (scheduler MMX, queda LLE)
#   $C3:910D  RTL  — fin de la función (retorna al scheduler del juego)
#
# Phase-safety VERIFICADA byte a byte: 0 accesos absolutos a registros PPU/APU
# ($21xx/$42xx) en todo el rango. Solo página cero/RAM + $004800 (S-DD1
# hard-enable, determinista) + multiplicador HW $4202/$4203. A diferencia del
# AOT del banco C2 (que contenía LDA $4212 en el spin y divergía en fase), esta
# rutina NO lee el beam → candidato AOT phase-safe.
#
# El loop padre $C3:8D93-$C3:8F4F contiene un JSR indirecto ($20E2,X, dispatcher
# MMX) — se deja en LLE. La entrada al AOT es $C3:8F50 (caída natural desde el
# padre 8F4F); la salida $C3:9093 (JMP $8D93) cae al intérprete (padre).

bank = 0xC3

# Animador de estrellas del título (hotzone ~70% del trabajo LLE del menú).
# Entry M16 X16 (el prólogo hace LDA #$0001 antes del SEP #$20).
func StarField 8F50 end:910E entry_mx:0,0
