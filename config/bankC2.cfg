# bankC2.cfg — Star Ocean (Japan) — banco C2 (blit de tiles del menú)
#
# Perfil 2026-08-30 (PHASE_MS, tramo menú f700-5100): familia $C2:FDxx/$C2:FExx
# (blit de tiles) = 40.5% del trabajo interpretado del menú — hotspot #1.
#
# 2026-08-30 noche — CORREGIDO con el C2WATCH (SNESRECOMP_C2WATCH=1): el entry
# real en runtime es $C2:FC43 (NO FC70, que es tabla de datos) — el watch capturó
# el flujo ejecutado: FC43 prologo (LDA #$08; STA $4300; LDA #$80; STA $4301 =
# setup DMA canal 0; STZ $29; REP #$20) -> JSR $FEE5 (copia, RTS en $FEFE) ->
# FC81-FCBF (volcado de mapa) -> FD1E-FD7B (blit de coords, LDA $0000,Y; ADC
# $22; STA $00,X...) -> JMP $FC81 (bucle por objeto). M/X a la entrada: m=1,
# x=0 (watch). Mapeo MMC confirmado: pagina 0 para banco C2 (r4804-07 en
# defaults 00 01 02 03; selector (bank>>4)&3 == (addr24>>20)&3 == ventana 0).
#
# AVISO: la funcion configura DMA ($4300/4301) — el codegen emite via
# cpu_write8 (MMIO con side-effects, patron C3 validado). Emisión por-función
# (patrón C3), validar A/B completo antes de integrar; si diverge/cuelga,
# REVERTIR.

bank = 0xC2

func BlitMenuTiles FC43 end:FF00 entry_mx:1,0
