# bankC0.cfg — Star Ocean (Japan)
#
# Bank $C0 is the S-DD1 MMC window where the NMI and IRQ interrupt
# handlers live ($C0:0000 and $C0:0221 respectively). The boot vectors
# at $00:FEB9/$00:FEBD JML into this bank through the MMC routing.
#
# Star Ocean uses the S-DD1 decompression chip with an MMC window that
# maps four 1MB pages into $C0-$FF via registers $4804-$4807. The
# default mapping is pages 0-3, which means $C0 maps the first 1MB of
# ROM linearly.
#
# The recompiler cannot follow JML into the MMC window from bank 00,
# but once code is executing in the MMC window, cross-bank JSL calls
# back to bank 00 ARE followed. The NMI/IRQ handlers are run under the
# interpreter bridge (interp_bridge_run_interrupt) rather than being
# statically recompiled, because the entry JML is not resolved.

bank = 0xC0

# NMI handler entry ($C0:0000) — the JML target of the $00:FEB9 vector.
# This is the main NMI service routine that handles vblank updates,
# PPU transfers, and game state ticks.
func NmiHandler 0000 end:0221
force_lle 0xC00000

# IRQ handler entry ($C0:0221) — the JML target of the $00:FEBD vector.
# Handles raster IRQ timing for the S-DD1 decompression pipeline.
func IrqHandler 0221 end:0400
force_lle 0xC00221

# --- S-DD1 initialization and register setup ---
# The boot code JMLs into the MMC window to set up S-DD1 registers,
# upload the SPC image, and enter the main game loop.

# S-DD1 register initialization ($C0:0400+)
# Configures $4804-$4807 MMC page registers and enables DMA channels.
func Sdd1Init 0400 end:0600

# SPC700 upload routine in MMC window
# Star Ocean uploads the SPC700 engine through the MMC window.
func SpcUpload 0600 end:0800

# Main game initialization
# Sets up PPU, DMA, and enters the cooperative task scheduler.
func GameInit 0800 end:0A00

# --- Task scheduler ---
# Star Ocean uses a cooperative task scheduler similar to other
# Square titles. The scheduler dispatches tasks via indirect jumps.

# Main game loop / scheduler entry
func MainLoop 0A00 end:0C00

# Task dispatcher
func TaskDispatch 0C00 end:0E00

# --- S-DD1 decompression driver ---
# The S-DD1 chip performs hardware decompression during DMA transfers.
# These routines set up DMA parameters and monitor decompression status.

# DMA setup for S-DD1 transfers
func DmaSetupForSdd1 0E00 end:1000

# S-DD1 status check
func CheckSdd1Status 1000 end:1200

# --- PPU update routines ---
# These handle VBlank PPU updates, tilemap uploads, and palette changes.

# VBlank handler core
func VBlankHandler 1200 end:1400

# PPU tilemap upload
func UploadTilemap 1400 end:1600

# Palette update during VBlank
func UpdatePaletteVBlank 1600 end:1800

# --- Game logic ---
# High-level game logic routines that run in the MMC window.

# Battle system
func BattleMain 1800 end:1A00
func BattleUpdate 1A00 end:1C00

# Field/map rendering
func FieldRender 1C00 end:1E00
func FieldUpdate 1E00 end:2000

# Menu system
func MenuMain 2000 end:2200
func MenuUpdate 2200 end:2400

# --- Interrupt handling helpers ---
# Additional interrupt-related routines in the MMC window.

# IRQ acknowledgment and cleanup
func AcknowledgeIrq 2400 end:2600

# NMI completion
func NmiComplete 2600 end:2800

# --- Data regions ---
# --- LLE-only: boot MMC window (C0:8000-C0:8FFF) ---
# Star Ocean's boot executes the SPC700 IPL handshake here (CMP $2140 / BNE
# waiting for the SPC bootROM to echo $BBAA). The interpreter bridge flushes
# the APU before every port access so the SPC advances and completes the
# handshake; journal-promoted AOT bodies in this region break that cadence
# and the boot spins forever. 1.Release runs this whole region LLE.
force_lle 0xC0824E
force_lle 0xC08289
force_lle 0xC08319
force_lle 0xC08496
force_lle 0xC084B8
force_lle 0xC08500
force_lle 0xC08594
force_lle 0xC08598
force_lle 0xC085FE
force_lle 0xC0878C
force_lle 0xC087B7
force_lle 0xC08812
force_lle 0xC0887F
force_lle 0xC08A5B

# Exclude known data areas between function blocks
exclude_range 2800 2A00
exclude_range 3000 3200
exclude_range 3800 3A00
exclude_range 4000 4200
exclude_range 4800 4A00
exclude_range 5000 5200
exclude_range 5800 5A00
exclude_range 6000 6200
exclude_range 6800 6A00
exclude_range 7000 7200
exclude_range 7800 7A00
exclude_range 8000 8200
exclude_range 8800 8A00
exclude_range 9000 9200
exclude_range 9800 9A00
exclude_range A000 A200
exclude_range A800 AA00
exclude_range B000 B200
exclude_range B800 BA00
exclude_range C000 C200
exclude_range C800 CA00
exclude_range D000 D200
exclude_range D800 DA00
exclude_range E000 E200
exclude_range E800 EA00
exclude_range F000 F200
exclude_range F800 FA00
