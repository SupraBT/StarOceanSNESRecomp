# bankC9.cfg - Star Ocean (Japan)
#
# The public Japanese ROM layout marks banks $C0-$CC as executable code and
# references these routines from data-table descriptions. These are conservative
# static seeds only; broader bank-level rooting remains unsafe without real
# function boundaries.
# Source: https://www.romhacking.net/documents/769/

bank = 0xC9

# $DC243A-$DC29D9 is documented as a table indexed from these routines.
func LayoutTableIndexA E4DC
func LayoutTableIndexB E57B
